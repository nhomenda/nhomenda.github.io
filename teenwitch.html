<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teen Witch Quote Generator</title>
    <style>
        :root {
            --bg-color: #fafafa;
            --text-color: #333;
            --container-bg: #fff;
            --border-color: #ddd;
            --btn-bg: #111;
            --btn-text: #fff;
            --btn-hover: #444;
        }

        [data-theme="dark"] {
            --bg-color: #1a1a1a;
            --text-color: #f0f0f0;
            --container-bg: #2d2d2d;
            --border-color: #444;
            --btn-bg: #f0f0f0;
            --btn-text: #111;
            --btn-hover: #ccc;
        }

        body {
            font-family: sans-serif;
            max-width: 500px;
            margin: 0 auto;
            padding: 40px 20px;
            text-align: center;
            background-color: var(--bg-color);
            color: var(--text-color);
            transition: background-color 0.3s, color 0.3s;
        }

        .controls {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 40px;
        }

        .theme-toggle {
            cursor: pointer;
            padding: 6px 12px;
            font-size: 0.85rem;
            background: none;
            border: 1px solid var(--border-color);
            color: var(--text-color);
            border-radius: 4px;
            transition: background-color 0.2s, border-color 0.2s;
        }

        #quote-container {
            min-height: 100px;
            margin-bottom: 30px;
            padding: 30px 20px;
            border: 1px solid var(--border-color);
            background: var(--container-bg);
            display: flex;
            align-items: center;
            justify-content: center;
            font-style: italic;
            font-size: 1.25rem;
            border-radius: 6px;
            transition: background-color 0.3s, border-color 0.3s;
        }

        .action-btn {
            padding: 12px 24px;
            font-size: 1rem;
            cursor: pointer;
            background-color: var(--btn-bg);
            color: var(--btn-text);
            border: none;
            border-radius: 4px;
            transition: background-color 0.2s;
        }

        .action-btn:hover {
            background-color: var(--btn-hover);
        }
    </style>
</head>
<body>

    <div class="controls">
        <button class="theme-toggle" onclick="toggleTheme()" id="theme-btn">🌙 Dark Mode</button>
    </div>

    <h1>Teen Witch Quotes</h1>
    
    <div id="quote-container">
        <p id="quote-text">Top that!</p>
    </div>

    <button class="action-btn" onclick="generateQuote()">Look at how funky he is!</button>

    <script>
        const quotes = [
            "Top that!",
            "I'm hot and you're not, but if you wanna get with me, give it one more shot. Top that!",
            "Look at how funky he is.",
            "I never secondary look at a guy.",
            "You are the most popular girl in school. You are a witch!",
            "Are you telling me I can have anything I want? Anything?",
            "Look, Louise, I don't wanna be a witch anymore. I just want to be normal.",
            "Shana, honey, you look beautiful. Like a dynamic presentation.",
            "I'm a dancer, Louise, not a mind reader.",
            "You look like a completely different person! It's like you're wearing an invisibility cloak or something."
        ];

        function generateQuote() {
            const quoteText = document.getElementById("quote-text");
            let newQuote;
            
            do {
                const randomIndex = Math.floor(Math.random() * quotes.length);
                newQuote = quotes[randomIndex];
            } while (newQuote === quoteText.innerText);

            quoteText.innerText = newQuote;
        }

        function toggleTheme() {
            const body = document.documentElement;
            const themeBtn = document.getElementById("theme-btn");
            
            if (body.getAttribute("data-theme") === "dark") {
                body.removeAttribute("data-theme");
                themeBtn.innerText = "🌙 Dark Mode";
            } else {
                body.setAttribute("data-theme", "dark");
                themeBtn.innerText = "☀️ Light Mode";
            }
        }
    </script>

</body>
</html>
